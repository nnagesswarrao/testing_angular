

<!-----Model Bible Start----->
<table>
  <thead>
    <tr>
      <th class="borde-gry with-200px font-12 fntwt">Book</th>
      <th class="borde-gry font-12 fntwt ">Ch..</th>
      <th class="borde-gry font-12 fntwt">Ver..</th>

    </tr>
  </thead>
  <tbody>
    <tr>
      <td colspan="3">
        <ion-row>
          <ion-col size="8" class="scrool-text hideline">
            <ion-list>
              <ion-item *ngFor="let k of data.books">
                <ion-label (click)="onSelectBook(k)" 
                  [ngClass]="k.isSelect ? ' isSelect font-12' : 'font-12' ">{{k.name}}</ion-label>
              </ion-item>
            </ion-list>
          </ion-col>
          <ion-col size="2" class="scrool-text hideline borde-gry">
            <ion-list>
              <ion-item *ngFor="let k of data.chapters">
                <ion-label (click)="onSelectChapter(k)"
                  [ngClass]="k.isSelect ? ' isSelect font-12' : 'font-12' ">{{k.chpter_id}}</ion-label>
              </ion-item>
            </ion-list>
          </ion-col>
          <ion-col size="2" class="scrool-text hideline borde-gry">
            <ion-list>
              <ion-item *ngFor="let k of data.version;let i=index">
                <ion-label (click)="onSelectVersion(k)"
                  [ngClass]="k.isSelect ? ' isSelect font-12' : 'font-12' ">{{i+1}}</ion-label>
              </ion-item>
            </ion-list>
          </ion-col>
        </ion-row>
      </td>
    </tr>
  </tbody>
</table>
<!---Model Bible End--->
